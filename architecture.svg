<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" width="1180" height="860" font-family="DejaVu Sans, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1180" height="860" fill="#f7f5f1"/>

  <text x="28" y="40" font-size="23" font-weight="700" fill="#1b1b1b">KAIROS — BTCUSD M1, achat seul</text>
  <text x="28" y="64" font-size="13.5" fill="#5a5751">Quatre têtes. Trois lisent le tronc. La quatrième l'ignore, et c'est une mesure qui l'impose.</text>

  <!-- ============ SOURCES ============ -->
  <text x="28" y="108" font-size="12" font-weight="700" fill="#7a5c2e" letter-spacing="1.2">TROIS SOURCES</text>

  <rect x="28" y="120" width="230" height="58" rx="6" fill="#fff" stroke="#c9c2b6"/>
  <text x="42" y="141" font-size="13" font-weight="600" fill="#1b1b1b">MT5 · barres M1</text>
  <text x="42" y="159" font-size="11.5" fill="#5a5751">OHLC + spread réellement coté</text>
  <text x="42" y="173" font-size="11.5" fill="#5a5751">c'est ce prix-là qu'on exécute</text>

  <rect x="28" y="188" width="230" height="58" rx="6" fill="#fff" stroke="#c9c2b6"/>
  <text x="42" y="209" font-size="13" font-weight="600" fill="#1b1b1b">MT5 · ticks</text>
  <text x="42" y="227" font-size="11.5" fill="#5a5751">113,6 M ticks → 7 colonnes/minute</text>
  <text x="42" y="241" font-size="11.5" fill="#5a5751">microstructure de cotation</text>

  <rect x="28" y="256" width="230" height="72" rx="6" fill="#fff" stroke="#b08968" stroke-width="1.6"/>
  <text x="42" y="277" font-size="13" font-weight="600" fill="#8a5a2b">Binance · klines 1 m</text>
  <text x="42" y="295" font-size="11.5" fill="#5a5751">6 colonnes de FLUX — vraies</text>
  <text x="42" y="309" font-size="11.5" fill="#5a5751">transactions, pas des cotations</text>
  <text x="42" y="323" font-size="11" fill="#8a5a2b">alignement +3 h, corrélation 0.994</text>

  <path d="M258 152 L300 152 L300 400" fill="none" stroke="#a8a096" stroke-width="1.4"/>
  <path d="M258 217 L300 217" fill="none" stroke="#a8a096" stroke-width="1.4"/>
  <path d="M258 292 L300 292" fill="none" stroke="#b08968" stroke-width="1.8"/>

  <!-- ============ CACHE ============ -->
  <rect x="300" y="380" width="300" height="86" rx="6" fill="#efe9de" stroke="#b5aa98" stroke-width="1.5"/>
  <text x="316" y="403" font-size="13.5" font-weight="700" fill="#1b1b1b">Cache M1 — 979 236 barres</text>
  <text x="316" y="423" font-size="12" fill="#3d3a35">274 colonnes de marché</text>
  <text x="316" y="440" font-size="11.5" fill="#5a5751">dont creux_rang et flux_rang,</text>
  <text x="316" y="455" font-size="11.5" fill="#5a5751">en RANG GLISSANT sur 20 000 barres</text>

  <!-- ============ ETAT ============ -->
  <text x="300" y="110" font-size="12" font-weight="700" fill="#7a5c2e" letter-spacing="1.2">L'ÉTAT VU PAR LE RÉSEAU</text>

  <rect x="300" y="124" width="300" height="106" rx="6" fill="#fff" stroke="#c9c2b6"/>
  <text x="316" y="146" font-size="13" font-weight="600" fill="#1b1b1b">lookback 4 barres × 279 colonnes</text>
  <rect x="316" y="158" width="196" height="26" rx="3" fill="#e4ece4" stroke="#9db89d"/>
  <text x="326" y="176" font-size="11.5" fill="#2f4a2f">274 colonnes de marché</text>
  <rect x="518" y="158" width="66" height="26" rx="3" fill="#f0e6e6" stroke="#c0a0a0"/>
  <text x="527" y="176" font-size="11.5" fill="#6b3838">5 position</text>
  <text x="316" y="203" font-size="11" fill="#5a5751">position · latent(ATR) · âge · capacité · creux</text>
  <text x="316" y="219" font-size="11" fill="#8a5a2b">normalisation FIGÉE sur le train du fold 1</text>

  <path d="M450 230 L450 380" fill="none" stroke="#a8a096" stroke-width="1.4" stroke-dasharray="4 3"/>
  <path d="M600 167 L660 167" fill="none" stroke="#7a7269" stroke-width="2"/>
  <path d="M654 161 l10 6 l-10 6 z" fill="#7a7269"/>

  <!-- ============ TRONC ============ -->
  <rect x="660" y="118" width="196" height="120" rx="8" fill="#e7edf4" stroke="#7e97b5" stroke-width="1.8"/>
  <text x="676" y="142" font-size="14" font-weight="700" fill="#243b52">TRONC — SAINT v2</text>
  <text x="676" y="163" font-size="11.5" fill="#3c5570">d_model 8 · 1 bloc · 1 tête</text>
  <text x="676" y="180" font-size="11.5" fill="#3c5570">attention sur les colonnes</text>
  <text x="676" y="197" font-size="11.5" fill="#3c5570">+ banque de référence</text>
  <text x="676" y="221" font-size="11.5" font-weight="600" fill="#243b52">→ norm → 3 MLP de lecture</text>

  <path d="M856 178 L900 178" fill="none" stroke="#7e97b5" stroke-width="2"/>
  <path d="M894 172 l10 6 l-10 6 z" fill="#7e97b5"/>

  <!-- ============ LES TROIS TETES DU TRONC ============ -->
  <rect x="900" y="112" width="250" height="52" rx="6" fill="#e4ece4" stroke="#6f9470" stroke-width="1.6"/>
  <text x="914" y="132" font-size="13" font-weight="700" fill="#2f4a2f">tete_achat</text>
  <text x="914" y="151" font-size="11.5" fill="#42613f">rang de l'occasion → barre d'entrée</text>

  <rect x="900" y="172" width="250" height="52" rx="6" fill="#efefef" stroke="#b9b9b9" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="914" y="192" font-size="13" font-weight="700" fill="#8a8a8a">tete_vente</text>
  <text x="914" y="211" font-size="11.5" fill="#8a8a8a">SANS GRADIENT — aucun signal mesuré</text>

  <rect x="900" y="232" width="250" height="66" rx="6" fill="#f6e9df" stroke="#c08552" stroke-width="1.6"/>
  <text x="914" y="252" font-size="13" font-weight="700" fill="#7d4a1e">tete_cloture</text>
  <text x="914" y="270" font-size="11.5" fill="#8a5a2b">prédit le RISQUE — excursion adverse,</text>
  <text x="914" y="285" font-size="11.5" fill="#8a5a2b">en ATR d'entrée. Une AMPLITUDE.</text>

  <!-- ============ LA TETE HORS TRONC ============ -->
  <rect x="660" y="560" width="490" height="128" rx="8" fill="#f3e8f0" stroke="#9c5f8e" stroke-width="2"/>
  <text x="678" y="586" font-size="14" font-weight="700" fill="#6b3a60">tete_profit — HORS DU TRONC</text>
  <text x="678" y="608" font-size="11.5" fill="#6b3a60">Elle lit QUATRE colonnes et rien d'autre :</text>
  <text x="678" y="626" font-size="11.5" font-weight="600" fill="#4a2842">latent · âge · creux_rang · flux_rang</text>
  <text x="678" y="648" font-size="11.5" fill="#6b3a60">Prédit ce qu'il RESTE à prendre, en ATR. Une amplitude.</text>
  <text x="678" y="668" font-size="11" fill="#8a5a8a">274 colonnes : IC +0.14 &lt; plancher 0.28, 1 arbre</text>
  <text x="678" y="682" font-size="11" fill="#4a2842">état seul  : IC +0.19 &gt; plancher 0.069, 100 arbres</text>

  <path d="M450 466 L450 620 L660 620" fill="none" stroke="#9c5f8e" stroke-width="2.4" stroke-dasharray="7 4"/>
  <path d="M654 614 l10 6 l-10 6 z" fill="#9c5f8e"/>
  <text x="462" y="612" font-size="11" font-weight="600" fill="#9c5f8e">contourne le tronc</text>

  <!-- ============ LES DEUX PORTES DE SORTIE ============ -->
  <text x="28" y="530" font-size="12" font-weight="700" fill="#7a5c2e" letter-spacing="1.2">LES DEUX PORTES DE SORTIE</text>

  <rect x="28" y="544" width="600" height="60" rx="6" fill="#f6e9df" stroke="#c08552" stroke-width="1.4"/>
  <text x="44" y="566" font-size="12.5" font-weight="700" fill="#7d4a1e">1 · STOP — fermer si  latent &lt; −(2.0 × risque_prédit)</text>
  <text x="44" y="586" font-size="11.5" fill="#5a5751">Exige un latent NÉGATIF : ne peut jamais fermer un gagnant.</text>
  <text x="44" y="599" font-size="11" fill="#8a5a2b">à 0.25× il coupait 76 % des trades — desserré le 2026-09-22</text>

  <rect x="28" y="614" width="600" height="60" rx="6" fill="#f3e8f0" stroke="#9c5f8e" stroke-width="1.4"/>
  <text x="44" y="636" font-size="12.5" font-weight="700" fill="#6b3a60">2 · PROFIT — fermer si  reste_prédit &lt; 1.0 ATR</text>
  <text x="44" y="656" font-size="11.5" fill="#5a5751">Le SEUL organe capable de solder une position en gain.</text>
  <text x="44" y="669" font-size="11" fill="#8a5a8a">seuil non mesuré — le journal compte ses déclenchements</text>

  <rect x="28" y="684" width="600" height="46" rx="6" fill="#eeeeea" stroke="#b5aa98" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="44" y="704" font-size="12.5" font-weight="600" fill="#4a4740">Filet — plafond de détention 480 minutes</text>
  <text x="44" y="721" font-size="11" fill="#5a5751">Il ne ferme plus QUE ce que les deux têtes ont laissé courir.</text>

  <!-- ============ CE QUE LA MESURE DIT ============ -->
  <rect x="28" y="752" width="1122" height="84" rx="6" fill="#fdf8ee" stroke="#d9c9a3" stroke-width="1.4"/>
  <text x="44" y="774" font-size="12" font-weight="700" fill="#7a5c2e">CE QUE LA MESURE ÉTABLIT, ET RIEN DE PLUS</text>
  <text x="44" y="794" font-size="11.5" fill="#3d3a35">Entrée : creux (close_ema_dev, décile bas en rang glissant) + flux fort → avantage +11.95 bps sur le marché du même mois, 20 mois sur 23, p = 0.0003.</text>
  <text x="44" y="811" font-size="11.5" fill="#3d3a35">Aucun signal à la VENTE, à aucun horizon, dans aucune condition testée. Aucun avantage sur l'or — le flux n'y existe pas.</text>
  <text x="44" y="828" font-size="11.5" fill="#8a3a3a">Aucun chiffre de performance n'est établi. La fenêtre de TEST n'a pas été lue.</text>
</svg>
